[project]
name = "geostats"
version = "0.1.0"
description = "Análisis geoestadístico de accidentes de tránsito urbanos y suburbanos (ATUS, INEGI)"
readme = "README.md"
authors = [
    { name = "Eduardo Luna", email = "A00842657@tec.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "esda>=2.10.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "libpysal>=4.15.0",
    "matplotlib>=3.11.1",
    "nutpie>=0.16.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pymc>=6.3.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
consolidar-atus = "geostats.consolidar:main"
zona-atus = "geostats.zonas:main"
limpiar-atus = "geostats.limpieza:main"
exportar-app = "geostats.modelo:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.3",
]
